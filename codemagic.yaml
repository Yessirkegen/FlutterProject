workflows:
  ios-simulator:
    name: iOS Simulator Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Flutter build iOS
        script: flutter build ios --debug --no-codesign
      - name: Build for iOS simulator (x86_64)
        script: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -arch x86_64 \
            clean build
          
          echo "Проверяем содержимое Runner.app:"
          ls -la build/Debug-iphonesimulator/Runner.app
          
          mkdir -p ../build/ios/ipa
          cd build/Debug-iphonesimulator
          zip -r ../../../build/ios/ipa/Runner.app.zip Runner.app
    artifacts:
      - build/ios/ipa/Runner.app.zip