workflows:
  ios-simulator-build:
    name: Build iOS Simulator App
    max_build_duration: 60

    environment:
      flutter: stable
      xcode: latest

    scripts:
      # 1. Получаем зависимости
      - name: Get Flutter packages
        script: |
          flutter pub get

      # 2. Собираем для iOS-симулятора
      - name: Build for iOS simulator
        script: |
          # flutter build ios --simulator формирует .app в build/ios/iphonesimulator
          flutter build ios --simulator --no-codesign
          
          # Упаковываем .app в Runner.app.zip
          cd build/ios/iphonesimulator
          zip -r Runner.app.zip Runner.app

    artifacts:
      # Артефакт можно скачать после сборки
      - build/ios/iphonesimulator/Runner.app.zip
