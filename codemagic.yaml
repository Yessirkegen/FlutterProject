workflows:
  ios-simulator-debug:
    name: "iOS Simulator Debug Build"
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Get Flutter packages
        script: flutter pub get

      - name: Install iOS pods
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build .app for iOS simulator
        script: |
          # Собираем Debug-версию .app для симулятора (x86_64)
          flutter build ios \
            --simulator \
            --no-codesign \
            --debug

          # Переходим в папку с результатом
          cd build/ios/iphonesimulator

          # Упаковываем .app в Runner.app.zip
          zip -r Runner.app.zip Runner.app

    artifacts:
      - build/ios/iphonesimulator/Runner.app.zip
