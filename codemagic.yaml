workflows:
  ios-debug:
    name: iOS Debug Build
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Build iOS for simulator
        script: |
          # Build for iOS simulator
          flutter build ios --debug --simulator
          
          # Create the archive
          cd build/ios/Debug-iphonesimulator
          zip -r "app.zip" "Runner.app"
          
          # Move the archive to artifacts directory
          mkdir -p ../../../build/ios/artifact
          mv app.zip ../../../build/ios/artifact/
    artifacts:
      - build/ios/artifact/app.zip
