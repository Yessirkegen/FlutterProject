workflows:
  ios-simulator:
    name: iOS Simulator Build
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Build for iOS simulator (x86_64)
        script: |
          flutter build ios --simulator

          echo "Поиск Runner.app:"
          find . -name "Runner.app"

          echo "Содержимое build/ios:"
          ls -R build/ios/

          mkdir -p build/ios/ipa
          APP_PATH=$(find . -name "Runner.app" | head -n 1)
          if [ -n "$APP_PATH" ]; then
            zip -r build/ios/ipa/Runner.app.zip "$APP_PATH"
          else
            echo "Runner.app не найден!"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/Runner.app.zip