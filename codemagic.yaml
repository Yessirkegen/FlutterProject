workflows:
  ios-debug:
    name: iOS Debug Build
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install
      - name: Build iOS for simulator
        script: |
          # Prepare Flutter
          flutter clean
          flutter pub get
          
          # Build using xcodebuild
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 14 Pro Max' \
            build
          
          # Create zip archive
          cd build/Debug-iphonesimulator
          zip -r "app.zip" "Runner.app"
          
          # Move to artifacts directory
          mkdir -p ../../../build/ios/artifact
          mv app.zip ../../../build/ios/artifact/
    artifacts:
      - build/ios/artifact/app.zip
